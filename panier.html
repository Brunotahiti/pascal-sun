<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier — Pascal Sun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=39">
  <link rel="stylesheet" href="css/effects.css?v=39">
  <script defer src="https://stats.pascal-sun.com/script.js" data-website-id="56116cc3-d031-4382-9868-905e305b96e5"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f7f3ec">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><circle cx=%2750%27 cy=%2750%27 r=%2726%27 fill=%27%23d4593a%27/><g fill=%27%23d4593a%27><path d=%27M81.5 44.4 96 50 81.5 55.6Z M76.2 68.4 82.5 82.5 68.4 76.2Z M55.6 81.5 50 96 44.4 81.5Z M31.6 76.2 17.5 82.5 23.8 68.4Z M18.5 55.6 4 50 18.5 44.4Z M23.8 31.6 17.5 17.5 31.6 23.8Z M44.4 18.5 50 4 55.6 18.5Z M68.4 23.8 82.5 17.5 76.2 31.6Z%27/></g></svg>">
</head>
<body data-page="cart">

  <header class="site-header" id="site-header"></header>

  <main>
    <div class="wrap">
      <div class="page-head reveal is-in">
        <span class="eyebrow" data-i18n="nav_cart"></span>
        <h1 class="section-title" data-i18n="cart_title"></h1>
        <p class="lede" data-i18n="cart_lede"></p>
      </div>

      <div class="empty-state" id="cart-empty" style="display:none;">
        <h2 class="section-title" style="font-size: clamp(24px, 3vw, 34px);" data-i18n="cart_empty_t"></h2>
        <p data-i18n="cart_empty_p"></p>
        <a class="btn" href="galerie.html" data-i18n="hero_cta"></a>
      </div>

      <div class="cart-layout" style="padding-bottom: 40px;">
        <div id="cart-list"></div>

        <aside class="order-panel" id="order-panel">
          <h2 data-i18n="order_title"></h2>
          <div class="totals">
            <div><span data-i18n="order_sub"></span><span id="order-subtotal">—</span></div>
            <div><span data-i18n="order_ship"></span><span id="order-shipping">—</span></div>
            <div class="grand"><span data-i18n="order_total"></span><span id="order-total">—</span></div>
          </div>
          <p class="form-note" id="ship-note" style="margin: -6px 0 16px;"></p>
          <form id="order-form">
            <div class="field">
              <label for="of-name" data-i18n="f_name"></label>
              <input id="of-name" name="name" required autocomplete="name">
            </div>
            <div class="field">
              <label for="of-email" data-i18n="f_email"></label>
              <input id="of-email" name="email" type="email" required autocomplete="email">
            </div>
            <div class="field">
              <label for="of-country" data-i18n="f_country"></label>
              <input id="of-country" name="country" required autocomplete="country-name">
            </div>
            <div class="field">
              <label data-i18n="delivery_mode"></label>
              <div class="choice-group">
                <label class="choice"><input type="radio" name="mode" value="livraison" checked><span data-i18n="delivery_ship"></span></label>
                <label class="choice"><input type="radio" name="mode" value="retrait"><span data-i18n="delivery_pickup"></span></label>
              </div>
            </div>
            <div class="field" id="zone-field">
              <label for="of-zone" data-i18n="ship_zone"></label>
              <select id="of-zone" name="zone"></select>
            </div>
            <div class="field">
              <label data-i18n="payment_method"></label>
              <div class="choice-group">
                <label class="choice"><input type="radio" name="payment" value="virement" checked><span data-i18n="pay_transfer"></span></label>
                <label class="choice"><input type="radio" name="payment" value="paypal"><span data-i18n="pay_paypal"></span></label>
              </div>
            </div>
            <div class="field">
              <label for="of-message" data-i18n="f_message"></label>
              <textarea id="of-message" name="message" data-i18n-ph="f_message_ph"></textarea>
            </div>
            <button class="btn" type="submit" style="width:100%; justify-content:center;" data-i18n="order_btn"></button>
            <p class="form-note" data-i18n="order_note"></p>
          </form>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js?v=39"></script>
  <script src="js/app.js?v=39"></script>
  <script src="js/effects.js?v=39"></script>
</body>
</html>
