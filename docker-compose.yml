services:
  web:
    build: .
    image: pascal-sun:latest
    container_name: pascal-sun
    restart: unless-stopped
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?admin password required}
      - APP_SECRET=${APP_SECRET:?app secret required}
      - UMAMI_URL=${UMAMI_URL:-}
      - UMAMI_USER=${UMAMI_USER:-admin}
      - UMAMI_PASSWORD=${UMAMI_PASSWORD:-}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - VAPID_PUBLIC=${VAPID_PUBLIC:-}
      - VAPID_PRIVATE=${VAPID_PRIVATE:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-contact@pascal-sun.com}
      - SMTP_PASS=${SMTP_PASS:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
    volumes:
      - pascal-sun-data:/app/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.pascalsun.entrypoints=websecure
      - traefik.http.routers.pascalsun.rule=Host(`pascal-sun.com`) || Host(`www.pascal-sun.com`)
      - traefik.http.routers.pascalsun.tls.certresolver=letsencrypt
      - traefik.http.services.pascalsun.loadbalancer.server.port=3000

volumes:
  pascal-sun-data:

networks:
  traefik:
    external: true
