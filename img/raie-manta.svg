             Q -40 44 -90 30
             Q -160 10 -250 -40
             Q -130 -110 0 -60 Z" fill="#1a1714"/>
    <path d="M0 88 Q 14 190 -8 260" stroke="#1a1714" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-34 -78 q -12 -26 4 -44 M 34 -78 q 12 -26 -4 -44" stroke="#1a1714" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="-46" cy="-52" r="6" fill="#f6f1e8"/>
    <circle cx="46" cy="-52" r="6" fill="#f6f1e8"/>
  </g>
  <!-- petit poisson corail -->
  <g transform="translate(560 300)">
