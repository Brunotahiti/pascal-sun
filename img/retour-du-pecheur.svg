<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">
  <rect width="1000" height="800" fill="#f6f1e8"/>
  <!-- soleil corail -->
  <circle cx="700" cy="470" r="86" fill="#d4593a"/>
  <rect x="560" y="470" width="300" height="90" fill="#f6f1e8"/>
  <!-- horizon -->
  <path d="M60 470 H 940" stroke="#1a1714" stroke-width="3" stroke-linecap="round"/>
  <!-- pirogue à balancier -->
  <g stroke="#1a1714" stroke-linecap="round" fill="none">
    <path d="M300 462 Q 380 452 470 458 Q 430 476 330 474 Q 300 470 300 462 Z" fill="#1a1714" stroke="none"/>
    <path d="M330 452 q 6 -34 2 -44" stroke-width="5"/>
    <path d="M470 458 q 26 -10 34 -26" stroke-width="6"/>
    <!-- balancier -->
    <path d="M350 466 L 290 500 M 430 466 L 370 500" stroke-width="4"/>
    <path d="M270 502 Q 330 494 392 500" stroke-width="7"/>
    <!-- pêcheur debout -->
    <g fill="#1a1714" stroke="none">
      <circle cx="398" cy="384" r="11"/>
      <path d="M390 396 q 8 -6 16 0 l 4 40 q -12 6 -24 0 Z"/>
    </g>
    <path d="M402 402 L 434 380 M 434 380 L 448 442" stroke-width="5"/>
  </g>
  <!-- reflets -->
  <g stroke="#1a1714" stroke-width="3" stroke-linecap="round" opacity=".55">
    <path d="M330 520 h 70 M 430 536 h 46 M 300 560 h 40 M 384 584 h 60 M 470 512 h 30"/>
  </g>
  <g stroke="#d4593a" stroke-width="4" stroke-linecap="round" opacity=".7">
    <path d="M660 520 h 80 M 690 548 h 46 M 668 578 h 30"/>
  </g>
  <text x="880" y="750" font-family="Georgia, serif" font-size="26" font-style="italic" fill="#1a1714">PS</text>
</svg>
