           Q 300 545 460 470
           Q 620 395 680 280
           Q 720 380 660 460
           Q 560 580 340 600
           Q 200 608 110 560 Z"
        fill="#1a1714"/>
  <path d="M240 565 Q 420 530 550 445 Q 630 390 665 320 Q 670 400 610 470 Q 500 570 320 585 Z" fill="#f6f1e8"/>
  <!-- crête lagon, douce -->
  <path d="M680 280 Q 720 380 660 460" fill="none" stroke="#2f9aa3" stroke-width="12" stroke-linecap="round"/>
  <path d="M655 300 q -10 46 -40 84" fill="none" stroke="#2f9aa3" stroke-width="5" stroke-linecap="round" opacity=".6"/>
