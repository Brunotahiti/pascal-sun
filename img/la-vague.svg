    </g>
    <path d="M23 -26 L 48 -40 L 58 6" stroke="#1a1714" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- ligne d'eau -->
  <path d="M110 640 H 890" stroke="#1a1714" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 676 h 80 M 500 672 h 120 M 740 682 h 60" stroke="#1a1714" stroke-width="3" stroke-linecap="round" opacity=".4"/>
  <!-- frise tapa -->
  <path d="M120 736 l11 -15 11 15z m33 0 l11 -15 11 15z m33 0 l11 -15 11 15z m33 0 l11 -15 11 15z m33 0 l11 -15 11 15z m33 0 l11 -15 11 15z"
