<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Pascal Sun</title>
  <meta name="description" content="Contactez Pascal Sun, peintre à Tahiti : question sur une œuvre, commande personnalisée, projet d'exposition.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/effects.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23d4593a'/></svg>">
</head>
<body data-page="contact">

  <header class="site-header" id="site-header"></header>

  <main>
    <div class="wrap">
      <div class="page-head reveal is-in">
        <span class="eyebrow" data-i18n="contact_eyebrow"></span>
        <h1 class="section-title" data-i18n="contact_title"></h1>
        <p class="lede" data-i18n="contact_lede"></p>
      </div>

      <div class="cart-layout" style="padding-bottom: 40px;">
        <form id="contact-form" class="order-panel">
          <div class="field">
            <label for="cf-name" data-i18n="f_name"></label>
            <input id="cf-name" name="name" required autocomplete="name">
          </div>
          <div class="field">
            <label for="cf-email" data-i18n="f_email"></label>
            <input id="cf-email" name="email" type="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="cf-subject" data-i18n="f_subject"></label>
            <input id="cf-subject" name="subject" data-i18n-ph="f_subject_ph">
          </div>
          <div class="field">
            <label for="cf-message" data-i18n="f_message"></label>
            <textarea id="cf-message" name="message" required></textarea>
          </div>
          <button class="btn" type="submit" data-i18n="contact_btn"></button>
        </form>

        <aside>
          <div class="value-card" style="margin-bottom: 30px;">
            <span class="num">●</span>
            <h3 data-i18n="studio_t"></h3>
            <p data-i18n="studio_p"></p>
          </div>
          <div class="value-card" style="margin-bottom: 30px;">
            <span class="num">●</span>
            <h3 data-i18n="followup_t"></h3>
            <p data-i18n="followup_p"></p>
          </div>
          <div class="value-card">
            <span class="num">●</span>
            <h3 data-i18n="ship_t"></h3>
            <p data-i18n="ship_p"></p>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/effects.js"></script>
</body>
</html>
