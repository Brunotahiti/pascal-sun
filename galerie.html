<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie — Pascal Sun</title>
  <meta name="description" content="Toutes les œuvres originales de Pascal Sun disponibles à l'acquisition. Scènes de vie polynésiennes, livraison mondiale assurée.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=55">
  <link rel="stylesheet" href="css/effects.css?v=55">
  <script defer src="https://stats.pascal-sun.com/script.js" data-website-id="56116cc3-d031-4382-9868-905e305b96e5"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f7f3ec">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><circle cx=%2750%27 cy=%2750%27 r=%2726%27 fill=%27%23d4593a%27/><g fill=%27%23d4593a%27><path d=%27M81.5 44.4 96 50 81.5 55.6Z M76.2 68.4 82.5 82.5 68.4 76.2Z M55.6 81.5 50 96 44.4 81.5Z M31.6 76.2 17.5 82.5 23.8 68.4Z M18.5 55.6 4 50 18.5 44.4Z M23.8 31.6 17.5 17.5 31.6 23.8Z M44.4 18.5 50 4 55.6 18.5Z M68.4 23.8 82.5 17.5 76.2 31.6Z%27/></g></svg>">
</head>
<body data-page="gallery">

  <header class="site-header" id="site-header"></header>

  <main>
    <div class="wrap">
      <div class="page-head reveal is-in">
        <span class="eyebrow" data-i18n="gallery_eyebrow"></span>
        <h1 class="section-title" data-i18n="gallery_title"></h1>
        <p class="lede" data-i18n="gallery_lede"></p>

        <!-- Projecteurs allumés : le texte s'efface et la signature de
             l'artiste s'éclaire à sa place, comme au mur d'une salle. -->
        <div class="salle-signature" aria-hidden="true">
          <span class="salle-halo"></span>
          <span class="spot salle-spot salle-spot-g"><span class="spot-beam"></span></span>
          <span class="spot salle-spot salle-spot-d"><span class="spot-beam"></span></span>
          <span class="salle-paraphe"></span>
        </div>
      </div>

      <div class="filters" id="filters"></div>
      <p class="form-note" id="gallery-count" style="margin: -22px 0 26px;"></p>

      <div class="grid" id="gallery-grid" style="padding-bottom: 40px;"></div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js?v=55"></script>
  <script src="js/app.js?v=55"></script>
  <script src="js/effects.js?v=55"></script>
</body>
</html>
