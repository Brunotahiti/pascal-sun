<body data-page="idees">

  <header class="site-header" id="site-header"></header>

  <main>
    <div class="wrap">
      <div class="page-head reveal is-in">
        <span class="eyebrow" data-i18n="idees_eyebrow"></span>
        <h1 class="section-title" data-i18n="idees_title"></h1>
