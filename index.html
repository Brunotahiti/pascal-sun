    /* Le rideau d'ouverture doit couvrir la page dès la toute première image.
       Le script d'effets ne s'exécute qu'au DOMContentLoaded : d'ici là, on
       apercevrait le site une fraction de seconde avant l'animation. */
    (function () {
      try {
        if (sessionStorage.getItem("ps_intro_seen")) return;
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        document.documentElement.classList.add("intro-pending");
        // filet de sécurité : jamais de page bloquée si le script ne charge pas
        setTimeout(function () {
          document.documentElement.classList.remove("intro-pending");
        }, 5000);
      } catch (e) { /* sessionStorage bloqué : la page s'affiche normalement */ }
    })();
  </script>
