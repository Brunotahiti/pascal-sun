  <link rel="stylesheet" href="css/style.css?v=60">
  <link rel="stylesheet" href="css/effects.css?v=60">
  <script>
    /* Le lagon doit couvrir la page dès la toute première image. L'animation
       n'est montée qu'une fois le catalogue chargé : d'ici là, on apercevrait
       l'invitation une fraction de seconde. Ce cache est retiré par
       vagueInvitation(), avec un filet de sécurité à 5 s. */
    (function () {
      try {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        document.documentElement.classList.add("intro-pending");
        setTimeout(function () {
          document.documentElement.classList.remove("intro-pending");
        }, 5000);
      } catch (e) { /* la page s'affiche normalement */ }
    })();
  </script>
